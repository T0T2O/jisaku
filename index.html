<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>勇者Goseの小数計算RPG（完全完成版）</title>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            font-size: 16px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .game-container {
            width: 95%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .screen {
            display: none;
            width: 100%;
            height: 360px;
            border: 5px solid white;
            background-color: #111;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .active {
            display: block;
        }

        #map-screen {
            background-color: #3a3;
            transition: background-color 0.5s;
        }

        #player {
            width: 30px;
            height: 30px;
            background-color: #05f;
            color: white;
            font-weight: bold;
            line-height: 30px;
            position: absolute;
            top: 150px;
            left: 30px;
            border-radius: 6px;
            z-index: 10;
            text-align: center;
            font-size: 18px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            transition: left 0.1s, top 0.1s;
        }

        #timer-disp, #area-disp {
            font-size: 18px;
            color: white;
            margin: 8px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }
        #timer-disp.hurry {
            color: #ff3333;
            animation: blink 0.5s infinite alternate;
        }
        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .obstacle {
            position: absolute;
            font-size: 26px;
            line-height: 30px;
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 1;
            text-align: center;
        }

        #battle-screen {
            background-color: #000;
            padding-top: 15px;
            box-sizing: border-box;
        }

        .status {
            font-size: 18px;
            margin: 4px;
            font-weight: bold;
        }
        #player-status {
            color: #0cf;
        }
        #monster-status {
            color: #f55;
            margin-bottom: 10px;
        }
        #question {
            font-size: 38px;
            margin: 15px 0;
            color: #ff0;
            font-weight: bold;
        }
        #ans-input {
            font-size: 24px;
            width: 120px;
            text-align: center;
            padding: 5px;
            border-radius: 5px;
            border: 2px solid #fff;
            background: #fff;
            color: #000;
        }
        #attack-btn {
            font-size: 22px;
            padding: 5px 15px;
            cursor: pointer;
            background-color: #f00;
            color: white;
            border: none;
            border-radius: 5px;
            margin-left: 10px;
            font-weight: bold;
        }
        #attack-btn:active {
            background-color: #b00;
        }

        /* コントローラー */
        .controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            justify-content: center;
        }
        .btn {
            background-color: #444;
            color: white;
            border: 2px solid white;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #222;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }

        #msg {
            font-size: 20px;
            margin-top: 15px;
            min-height: 30px;
            font-weight: bold;
            color: #ff4500;
        }

        /* カスタムお知らせウィンドウ */
        #custom-alert {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 320px;
            background-color: #333;
            border: 4px solid #fff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #alert-msg {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
            line-height: 1.4;
        }
        #alert-btn {
            font-size: 18px;
            padding: 8px 24px;
            background-color: #05f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #alert-btn:active {
            background-color: #03a;
        }
    </style>
</head>
<body>

<div id="area-disp">エリア 1: 小数のたし算・ひき算</div>
<div id="timer-disp">バトル残り時間: --分--秒</div>

<div class="game-container">
    <!-- マップ画面 -->
    <div id="map-screen" class="screen active">
        <div id="player">勇</div>
    </div>

    <!-- 戦闘画面 -->
    <div id="battle-screen" class="screen">
        <div class="status" id="player-status">勇者Goseの HP: <span id="player-hp">500</span></div>
        <div class="status" id="monster-status"><span id="monster-name">モンスター</span>の HP: <span id="monster-hp">50</span></div>
        <div id="question">1.2 + 0.5 = ?</div>
        <input type="number" id="ans-input" step="any" pattern="[0-9.]*" inputmode="decimal" placeholder="答え">
        <button id="attack-btn">攻撃</button>
    </div>

    <!-- カスタムお知らせウィンドウ -->
    <div id="custom-alert">
        <div id="alert-msg">メッセージ</div>
        <button id="alert-btn" onclick="closeAlert()">OK</button>
    </div>

    <!-- 操作用コントローラー -->
    <div class="controls" id="move-controls">
        <div class="btn up" id="btn-up">▲</div>
        <div class="btn left" id="btn-left">◀</div>
        <div class="btn down" id="btn-down">▼</div>
        <div class="btn right" id="btn-right">▶</div>
    </div>
</div>

<div id="msg">すべての敵をたおして右端のゴールを目指せ！</div>

<script>
    // ゲーム状態管理オブジェクト
    const GAME = {
        state: 'map', 
        area: 1,
        timeLeft: 180, // バトルごとの制限時間3分（180秒）
        player: { x: 30, y: 150, hp: 500 }, 
        monster: { name: "モンスター", hp: 50, currentAns: 0 }, 
        timerId: null,
        enemies: [],
        screenWidth: 0,
        screenHeight: 360,
        gridSize: 30,
        alertCallback: null
    };

    // DOM要素キャッシュ
    const elMapScreen = document.getElementById('map-screen');
    const elBattleScreen = document.getElementById('battle-screen');
    const elPlayer = document.getElementById('player');
    const elTimer = document.getElementById('timer-disp');
    const elArea = document.getElementById('area-disp');
    const elPlayerHp = document.getElementById('player-hp');
    const elMonsterName = document.getElementById('monster-name');
    const elMonsterHp = document.getElementById('monster-hp');
    const elQuestion = document.getElementById('question');
    const elAnsInput = document.getElementById('ans-input');
    const elControls = document.getElementById('move-controls');
    const elMsg = document.getElementById('msg');
    const elAlert = document.getElementById('custom-alert');
    const elAlertMsg = document.getElementById('alert-msg');

    // 各ステージの設定
    const AREA_CONFIG = {
        1: { name: "エリア 1: 小数のたし算・ひき算", bg: "#3a3", enemy: "🌲", monsterName: "コダマ" },
        2: { name: "エリア 2: 小数×整数・小数÷整数", bg: "#d83", enemy: "⛰️", monsterName: "ゴーレム" },
        3: { name: "エリア 3: 小数×小数・小数÷小数", bg: "#a3a", enemy: "🔥", monsterName: "大魔王ハデス" }
    };

    function updateScreenSize() {
        GAME.screenWidth = elMapScreen.clientWidth;
    }

    // タイマー表示の更新
    function formatTimeDisplay() {
        if (GAME.state !== 'battle') {
            elTimer.textContent = "次のバトルに備えよ！";
            elTimer.classList.remove('hurry');
            return;
        }
        const minutes = Math.floor(GAME.timeLeft / 60);
        const seconds = GAME.timeLeft % 60;
        elTimer.textContent = `バトル残り時間: ${minutes}分${seconds.toString().padStart(2, '0')}秒`;
        
        if (GAME.timeLeft <= 30) {
            elTimer.classList.add('hurry');
        } else {
            elTimer.classList.remove('hurry');
        }
    }

    // ゲーム全体のリセット
    function resetGame() {
        GAME.state = 'map';
        GAME.area = 1;
        GAME.player.hp = 500; 
        formatTimeDisplay();
        elPlayerHp.textContent = GAME.player.hp;
elMsg.textContent = "すべての敵をたおして右端のゴールを目指せ！";
elAnsInput.value = "";
        
 elBattleScreen.classList.remove('active');
elMapScreen.classList.add('active')
elControls.style.display = 'grid';
initMap();
// 1秒ごとの監視タイマーを始動（バトル中のみカウントダウン）
clearInterval(GAME.timerId);
GAME.timerId = setInterval(() => {
if (GAME.state === 'battle') {
GAME.timeLeft--;
formatTimeDisplay();
if (GAME.timeLeft <= 0) {
clearInterval(GAME.timerId);
GAME.state = 'gameover';
showAlert(⏰ タイムアップ！<br>3分以内にモンスターを倒せませんでした..., () => {
resetGame();
});
}
}
}, 1000);
}
function showAlert(text, callback) {
elAlertMsg.innerHTML = text;
elAlert.style.display = 'block';
GAME.alertCallback = callback;
}
function closeAlert() {
elAlert.style.display = 'none';
if (GAME.alertCallback) {
GAME.alertCallback();
GAME.alertCallback = null;
}
}
// マップ構築
function initMap() {
updateScreenSize();
document.querySelectorAll('.obstacle').forEach(e => e.remove());
GAME.enemies = [];
elArea.textContent = AREA_CONFIG[GAME.area].name;
elMapScreen.style.backgroundColor = AREA_CONFIG[GAME.area].bg;
GAME.player.x = GAME.gridSize;
GAME.player.y = 150;
updatePlayerPosition();
const emoji = AREA_CONFIG[GAME.area].enemy;
const maxGridX = Math.floor((GAME.screenWidth - GAME.gridSize * 2) / GAME.gridSize);
for (let i = 0; i < 3; i++) {
const segmentWidth = Math.floor(maxGridX / 3);
const gridX = 2 + (i * segmentWidth) + Math.floor(Math.random() * (segmentWidth - 1));
const gridY = 1 + Math.floor(Math.random() * 9);
const enemyX = gridX * GAME.gridSize;
const enemyY = gridY * GAME.gridSize;
const div = document.createElement('div');
div.className = 'obstacle';
div.style.left = enemyX + 'px';
div.style.top = enemyY + 'px';
div.textContent = emoji;
elMapScreen.appendChild(div);
GAME.enemies.push({ x: enemyX, y: enemyY, element: div });
}
}
function updatePlayerPosition() {
elPlayer.style.left = GAME.player.x + 'px';
elPlayer.style.top = GAME.player.y + 'px';
}
// プレイヤー移動
function movePlayer(dx, dy) {
if (GAME.state !== 'map') return;
let nextX = GAME.player.x + dx;
let nextY = GAME.player.y + dy;
if (nextX < 0 || nextX > (GAME.screenWidth - GAME.gridSize) || nextY < 0 || nextY > (GAME.screenHeight - GAME.gridSize)) {
return;
}
GAME.player.x = nextX;
GAME.player.y = nextY;
updatePlayerPosition();
const hitEnemyIndex = GAME.enemies.findIndex(e => e.x === GAME.player.x && e.y === GAME.player.y);
if (hitEnemyIndex !== -1) {
startBattle(hitEnemyIndex);
return;
}
if (GAME.player.x >= (GAME.screenWidth - GAME.gridSize * 2)) {
if (GAME.enemies.length > 0) {
elMsg.textContent = "⚠️ まず敵をたおそう！";
GAME.player.x -= dx;
updatePlayerPosition();
return;
}
if (GAME.area < 3) {
GAME.area++;
showAlert(エリア ${GAME.area} （次のエリア）へ進む！, () => {
initMap();
elMsg.textContent = "すべての敵をたおして右端のゴールを目指せ！";
});
} else {
clearInterval(GAME.timerId);
GAME.state = 'clear';
showAlert(🎉 ゲームクリア！<br>大魔王ハデスを討伐した！, () => {
resetGame();
});
}
}
}
// バトル開始
function startBattle(enemyIndex) {
GAME.state = 'battle';
GAME.activeEnemyIndex = enemyIndex;
GAME.monster.name = AREA_CONFIG[GAME.area].monsterName;
GAME.timeLeft = 180; // バトル開始時にタイマーを3分（180秒）にリセット
if (GAME.area === 3) {
GAME.monster.hp = 100; // 大魔王ハデスのHPは100
} else {
GAME.monster.hp = 50;  // 通常モブのHPは50
}
formatTimeDisplay();
elPlayerHp.textContent = GAME.player.hp;
elMonsterName.textContent = GAME.monster.name;
elMapScreen.classList.remove('active');
elBattleScreen.classList.add('active');
elMsg.textContent = "制限時間は3分！計算を解いてダメージを与えろ！";
makeQuestion();
}
// 問題生成
function makeQuestion() {
elMonsterHp.textContent = GAME.monster.hp;
elPlayerHp.textContent = GAME.player.hp;
elAnsInput.value = "";
elAnsInput.focus();
let qText = "";
let ans = 0;
if (GAME.area === 1) {
let a = (Math.floor(Math.random() * 9) + 1) / 10;
let b = (Math.floor(Math.random() * 9) + 1) / 10;
if (Math.random() > 0.5) {
qText = ${a} + ${b};
ans = a + b;
} else {
if (a < b) { const t = a; a = b; b = t; }
qText = ${a} - ${b};
ans = a - b;
}
} else if (GAME.area === 2) {
if (Math.random() > 0.5) {
let a = (Math.floor(Math.random() * 9) + 1) / 10;
let b = Math.floor(Math.random() * 5) + 2;
qText = ${a} × ${b};
ans = a * b;
} else {
let b = Math.floor(Math.random() * 4) + 2;
let ansInt = (Math.floor(Math.random() * 5) + 1) / 10;
let a = parseFloat((ansInt * b).toFixed(1));
qText = ${a} ÷ ${b};
ans = ansInt;
}
} else {
if (Math.random() > 0.5) {
let a = (Math.floor(Math.random() * 9) + 1) / 10;
let b = (Math.floor(Math.random() * 9) + 1) / 10;
qText = ${a} × ${b};
ans = a * b;
} else {
let b = Math.floor(Math.random() * 5) + 2;
let ansInt = (Math.floor(Math.random() * 5) + 2) / 10;
let a = parseFloat((ansInt * b).toFixed(2));
qText = ${a} ÷ ${b};
ans = ansInt;
}
}
GAME.monster.currentAns = parseFloat(ans.toFixed(2));
elQuestion.textContent = qText + " = ?";
}
// 答え合わせ
document.getElementById('attack-btn').onclick = function() {
if (GAME.state !== 'battle') return;
const userAns = parseFloat(elAnsInput.value);
if (isNaN(userAns)) return;
if (Math.abs(userAns - GAME.monster.currentAns) < 0.001) {
GAME.monster.hp -= 10;
elMsg.textContent = "⭕ 正解！10ダメージを与えた！";
if (GAME.monster.hp <= 0) {
elMsg.textContent = ${GAME.monster.name}を倒した！;
const enemy = GAME.enemies[GAME.activeEnemyIndex];
if (enemy && enemy.element) {
enemy.element.remove();
}
GAME.enemies.splice(GAME.activeEnemyIndex, 1);
setTimeout(() => {
GAME.state = 'map';
formatTimeDisplay(); // タイマー表示のテキスト変更
elBattleScreen.classList.remove('active');
elMapScreen.classList.add('active');
elMsg.textContent = "すべての敵をたおして右端のゴールを目指せ！";
}, 1000);
} else {
setTimeout(makeQuestion, 800);
}
} else {
GAME.player.hp -= 10;
elMsg.textContent = ❌ ちがうよ！ (正解:${GAME.monster.currentAns}) 10ダメージを受けた！;
if (GAME.player.hp <= 0) {
clearInterval(GAME.timerId);
GAME.state = 'gameover';
showAlert(💀 体力がなくなってしまった！<br>ゲームオーバー..., () => {
resetGame();
});
} else {
setTimeout(makeQuestion, 2000);
}
}
};
// コントローラーのタッチ・クリックイベント処理関数
const attachButtonEvent = (id, dx, dy) => {
const btn = document.getElementById(id);
if (!btn) return;
const triggerAction = (e) => {
e.preventDefault();
movePlayer(dx, dy);
};
btn.addEventListener('mousedown', triggerAction);
btn.addEventListener('touchstart', triggerAction, { passive: false });
};
// 各移動キーの設定登録
attachButtonEvent('btn-up', 0, -GAME.gridSize);
attachButtonEvent('btn-left', -GAME.gridSize, 0);
attachButtonEvent('btn-down', 0, GAME.gridSize);
attachButtonEvent('btn-right', GAME.gridSize, 0);
// PCキースクロールガード & 移動登録
window.addEventListener('keydown', function(e) {
if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) > -1) {
e.preventDefault();
}
if (GAME.state === 'map') {
if (e.key === 'ArrowUp') movePlayer(0, -GAME.gridSize);
if (e.key === 'ArrowLeft') movePlayer(-GAME.gridSize, 0);
if (e.key === 'ArrowDown') movePlayer(0, GAME.gridSize);
if (e.key === 'ArrowRight') movePlayer(GAME.gridSize, 0);
}
}, {passive: false});
elAnsInput.addEventListener('keypress', function(e) {
if (e.key === 'Enter') {
document.getElementById('attack-btn').click();
}
});
window.addEventListener('resize', updateScreenSize);
// 初回スタート起動
resetGame();
</script>
</body>
</html>
